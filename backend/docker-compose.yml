services:
  redis:
    image: redis:alpine
    container_name: hotel_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Postgres rieng cho bo e2e-spec (test/*.e2e-spec.ts) - khop dung
  # E2E_DATABASE_URL trong .env/.env.example (postgres/postgres/
  # hotel_management_e2e tren localhost:5432). Tach hoan toan khoi
  # DATABASE_URL (Neon cloud, dung cho dev/app that) - khong bao gio
  # migration:run/app that dong toi container nay, chi cac file
  # *.e2e-spec.ts tu ket noi + tu chay migrations trong beforeAll().
  postgres-e2e:
    image: postgres:16-alpine
    container_name: hotel_postgres_e2e
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_management_e2e
    ports:
      - "5432:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_management_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  postgres_e2e_data:
